services:
  # ----------------------------------------------------------------------------
  # 1. Object Storage (MinIO S3 Compatible)
  # ----------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: kavach-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kavach-net

  # ----------------------------------------------------------------------------
  # 2. AI Service (FastAPI: OCR + NLP + Semantic Search)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: kavach-ai
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - kavach-net

  # ----------------------------------------------------------------------------
  # 3. Core Backend (Spring Boot REST API)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kavach-backend
    ports:
      - "8080:8080"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres?sslmode=require}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres.udfhvrbjibebsgaujesp}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-sykdig-Jimzij-2nagfa}
      FABRIC_GATEWAY_ENDPOINT: ${FABRIC_GATEWAY_ENDPOINT:-}
      FABRIC_CHANNEL: ${FABRIC_CHANNEL:-}
      FABRIC_CHAINCODE: ${FABRIC_CHAINCODE:-}
      FABRIC_MSP_ID: ${FABRIC_MSP_ID:-}
      FABRIC_CERTIFICATE: ${FABRIC_CERTIFICATE:-}
      FABRIC_PRIVATE_KEY: ${FABRIC_PRIVATE_KEY:-}
      FABRIC_TLS_CERTIFICATE: ${FABRIC_TLS_CERTIFICATE:-}
    restart: unless-stopped
    networks:
      - kavach-net

# ------------------------------------------------------------------------------
# Networks & Persistent Volumes
# ------------------------------------------------------------------------------
networks:
  kavach-net:
    driver: bridge

volumes:
  minio_data:
